# -----------------------------------------------------------------------------
# Duties. tier 1 = scarce/procedural (scheduled first), tier 2 = core coverage,
# tier 3 = residual clinic fill.
# -----------------------------------------------------------------------------
shifts:
  # ---- tier 1: procedural & diagnostic --------------------------------------
  - id: CATH_LAB
    label: Cath Lab (2 rooms)
    location: hospital
    tier: 1
    count: 2
    required_skills: [pci]
    fairness_group: cath
    when:
      weekdays: [mon, tue, wed, thu, fri]
      exclude_dates: [2026-10-14, 2026-10-28]   # hybrid room in use for TAVR

  - id: CATH_LAB_TAVR_DAY
    label: Cath Lab (1 room, TAVR day)
    location: hospital
    tier: 1
    count: 1
    required_skills: [pci]
    fairness_group: cath
    when: {dates: [2026-10-14, 2026-10-28]}

  - id: STRUCTURAL_TAVR
    label: Structural / TAVR
    location: hospital
    tier: 1
    count: 2
    required_skills: [structural]
    fairness_group: structural
    credit: 1.5
    when:
      nth_weekday_of_month:
        - {week: 2, weekday: wed}
        - {week: 4, weekday: wed}

  - id: EP_LAB
    label: EP Lab (ablation)
    location: hospital
    tier: 1
    count: 1
    required_skills: [ep_ablation]
    fairness_group: ep
    when: {weekdays: [tue, thu]}

  - id: DEVICE_CLINIC
    label: Device Clinic
    location: clinic
    session: pm
    tier: 1
    count: 1
    required_skills: [ep_device]
    fairness_group: ep
    when: {weekdays: [mon, wed]}

  - id: TEE_SERVICE
    label: TEE Service
    location: hospital
    session: am
    tier: 1
    count: 1
    required_skills: [tee]
    fairness_group: tee
    when: {weekdays: [mon, tue, wed, thu, fri]}

  - id: STRESS_LAB
    label: Stress Lab
    location: hospital
    session: am
    tier: 1
    count: 1
    any_skills:
      - [stress_echo, nuclear_read]
    fairness_group: stress
    when: {weekdays: [mon, tue, wed, thu, fri]}

  - id: ECHO_READ
    label: Echo reading list
    location: hospital
    session: background
    tier: 1
    count: 2
    required_skills: [echo_read]
    fairness_group: echo
    credit: 0.5
    when: {weekdays: [mon, tue, wed, thu, fri]}

  - id: NUCLEAR_READ
    label: Nuclear reading list
    location: hospital
    session: background
    tier: 1
    count: 1
    required_skills: [nuclear_read]
    fairness_group: nuclear
    credit: 0.5
    when: {weekdays: [mon, tue, wed, thu, fri]}

  - id: CARDIAC_CT_READ
    label: Cardiac CT/MR reading
    location: remote
    session: background
    tier: 1
    count: 1
    required_skills: [cardiac_ct]
    fairness_group: cardiac_ct
    credit: 0.5
    when: {weekdays: [tue, thu]}

  - id: BRONCH_SUITE
    label: Bronchoscopy suite
    location: hospital
    tier: 1
    count: 1
    required_skills: [bronch]
    fairness_group: bronch
    when: {weekdays: [mon, wed]}

  - id: EBUS
    label: EBUS / advanced airway
    location: hospital
    tier: 1
    count: 1
    required_skills: [ebus]
    fairness_group: bronch
    when: {weekdays: [fri]}

  - id: PFT_READ
    label: PFT reading list
    location: remote
    session: background
    tier: 1
    count: 1
    required_skills: [pft_read]
    fairness_group: pft
    credit: 0.5
    when: {weekdays: [mon, tue, wed, thu, fri]}

  # ---- tier 2: core inpatient coverage & call --------------------------------
  - id: CARD_CONSULT
    label: Cardiology inpatient service
    location: hospital
    tier: 2
    count: 1
    specialties: [cardiology]
    fairness_group: inpatient
    block_days: 7
    when: {weekdays: [mon, tue, wed, thu, fri, sat, sun], include_holidays: true}

  - id: CCU_SERVICE
    label: CCU service
    location: hospital
    tier: 2
    count: 1
    required_skills: [ccu]
    fairness_group: ccu
    block_days: 7
    when: {weekdays: [mon, tue, wed, thu, fri, sat, sun], include_holidays: true}

  - id: HF_SERVICE
    label: Advanced heart failure service
    location: hospital
    tier: 2
    count: 1
    required_skills: [hf]
    fairness_group: hf
    when: {weekdays: [mon, tue, wed, thu, fri]}

  - id: CARD_CALL
    label: Cardiology call
    location: hospital
    session: background
    tier: 2
    count: 1
    specialties: [cardiology]
    fairness_group: call_card
    credit: 2.0
    when: {weekdays: [mon, tue, wed, thu, fri, sat, sun], include_holidays: true}

  - id: ICU_SERVICE
    label: ICU service
    location: hospital
    tier: 2
    count: 1
    required_skills: [icu]
    fairness_group: icu
    block_days: 7
    when: {weekdays: [mon, tue, wed, thu, fri, sat, sun], include_holidays: true}

  - id: PULM_CONSULT
    label: Pulmonary consult service
    location: hospital
    tier: 2
    count: 1
    specialties: [pulmonary]
    fairness_group: pulm_inpatient
    when: {weekdays: [mon, tue, wed, thu, fri]}

  - id: PULM_CALL
    label: Pulmonary call
    location: hospital
    session: background
    tier: 2
    count: 1
    specialties: [pulmonary]
    fairness_group: call_pulm
    credit: 2.0
    when: {weekdays: [mon, tue, wed, thu, fri, sat, sun], include_holidays: true}

  # ---- tier 3: clinic ---------------------------------------------------------
  - id: CLINIC_CARD
    label: Cardiology clinic
    location: clinic
    tier: 3
    count: 2
    max_count: 8
    specialties: [cardiology]
    fairness_group: clinic_card
    credit: 0.25
    hard: false
    when: {weekdays: [mon, tue, wed, thu, fri]}

  - id: CLINIC_PULM
    label: Pulmonary clinic
    location: clinic
    tier: 3
    count: 1
    max_count: 4
    specialties: [pulmonary]
    fairness_group: clinic_pulm
    credit: 0.25
    hard: false
    when: {weekdays: [mon, tue, wed, thu, fri]}

# -----------------------------------------------------------------------------
# Census rules evaluated per day across the whole service line.
# -----------------------------------------------------------------------------
rules:
  - id: echo_reader_on_site
    description: an echo reader must be physically in the hospital every weekday
    locations: [hospital]
    any_skills: [echo_read]
    specialties: [cardiology]
    min: 1
    severity: hard
    when: {weekdays: [mon, tue, wed, thu, fri]}

  - id: hospital_cardiology_cap
    description: no more than 9 cardiologists physically in the hospital in one day
    locations: [hospital]
    sessions: [full, am, pm]      # reading lists are background, not presence
    specialties: [cardiology]
    max: 9
    severity: hard
    when: {weekdays: [mon, tue, wed, thu, fri, sat, sun], include_holidays: true}

  - id: interventional_clinic_access
    description: keep at least one interventionalist in clinic for new referrals
    locations: [clinic]
    any_skills: [pci]
    min: 1
    severity: soft
    weight: 2
    when: {weekdays: [mon, tue, wed, thu, fri]}

  - id: ep_presence
    description: at least one EP physician working somewhere each weekday
    any_skills: [ep_device]
    min: 1
    severity: soft
    weight: 2
    when: {weekdays: [mon, tue, wed, thu, fri]}

  - id: clinic_cardiology_floor
    description: clinic access target — at least 4 cardiology clinic sessions/day
    locations: [clinic]
    specialties: [cardiology]
    min: 4
    severity: soft
    weight: 3
    when: {weekdays: [mon, tue, wed, thu, fri]}

  - id: pulmonary_hospital_cap
    description: keep no more than 3 pulmonologists in the hospital at once
    locations: [hospital]
    sessions: [full, am, pm]
    specialties: [pulmonary]
    max: 3
    severity: soft
    weight: 2
    when: {weekdays: [mon, tue, wed, thu, fri, sat, sun], include_holidays: true}

  - id: weekend_hospital_floor
    description: weekend hospital coverage across both specialties
    locations: [hospital]
    sessions: [full, am, pm]
    min: 3
    severity: hard
    when: {weekdays: [sat, sun], include_holidays: true}

# -----------------------------------------------------------------------------
# Physician requests. off_hard = approved leave the solver may never override.
# -----------------------------------------------------------------------------
requests:
  - {physician: p_rao, kind: off_hard, start: 2026-10-05, end: 2026-10-09, note: approved leave}
  - {physician: c_kim, kind: off_soft, start: 2026-10-20, end: 2026-10-22, weight: 2, note: prefers off}
  - {physician: c_gupta, kind: prefer_shift, date: 2026-10-13, shift: TEE_SERVICE, weight: 3}
  - {physician: c_jansen, kind: avoid_shift, start: 2026-10-01, end: 2026-10-31, shift: CARD_CALL, weight: 3}
  - {physician: c_eze, kind: on_soft, date: 2026-10-06, shift: EP_LAB, weight: 3}

# Pre-committed assignments the solver must schedule around.
locked:
  - {date: 2026-10-01, shift: CARD_CONSULT, physician: c_ibrahim}
