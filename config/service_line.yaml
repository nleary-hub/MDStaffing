# =============================================================================
# Cardiovascular & Pulmonary service line — October 2026 block
#
# Everything the scheduler knows lives in this file. Edit it, re-run
# `python -m mdstaffing build config/service_line.yaml`, and the schedule,
# equity report and rule check regenerate.
# =============================================================================
name: Cardiovascular & Pulmonary Service Line

period:
  start: 2026-10-01
  end: 2026-10-31

holidays:
  - 2026-10-12        # observed holiday: clinics closed, hospital services run

settings:
  default_fill_shift: CLINIC_CARD   # where otherwise-free cardiologists land
  max_background_per_day: 3         # reading lists / call stacked on clinical work
  daily_capacity: 1.0               # one full day of work per physician per day
  repair_passes: 3
  weights:                          # tune how the solver trades goals off
    fairness: 10
    weekend: 8
    request: 12
    soft_rule: 8

# -----------------------------------------------------------------------------
# Physicians. `skills` drive credentialing; `fte` and `shift_weights` drive the
# fair-share targets; `admin` is protected time; `unavailable` is vacation/leave.
# -----------------------------------------------------------------------------
