# =============================================================================
# Cardiovascular & Pulmonary Service Line — November 2026 block
#
# CARDIOLOGY ROSTER (19) reflects the real division structure:
#   3  electrophysiologists          tag: ep
#   6  invasive cardiologists        tag: invasive   (cath lab + STEMI call)
#      └─ 1 of the 6 also does TAVR  skill: structural
#  10  non-invasive cardiologists    tag: non_invasive
#      (diagnostic studies, inpatient consults, general cardiology call)
#
# PULMONARY ROSTER (6) is still PLACEHOLDER seed data — replace with the real
# pulmonary/critical care group. Everything below it is wired the same way.
#
#   python -m mdstaffing build config/service_line.yaml --out out
# =============================================================================
name: Cardiovascular & Pulmonary Service Line

period:
  start: 2026-11-01
  end: 2026-11-30

holidays:
  - 2026-11-26        # Thanksgiving — clinics closed, hospital services run
  - 2026-11-27

settings:
  default_fill_shift: CLINIC_CARD
  max_background_per_day: 3     # a reading list and call can sit on a clinical day
  daily_capacity: 1.0
  repair_passes: 3
  weights:
    fairness: 10
    weekend: 8
    request: 12
    soft_rule: 8

