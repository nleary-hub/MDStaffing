[project]
name = "mdstaffing"
version = "0.1.0"
description = "Rule-driven physician scheduling for a cardiovascular and pulmonary service line"
requires-python = ">=3.10"
dependencies = ["PyYAML>=5.4"]

[project.scripts]
mdstaffing = "mdstaffing.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mdstaffing"]
